<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 125" width="100%" height="100%">
  <!-- Fondo marfil oficial Maison -->
  <rect width="100" height="125" fill="#FAF8F5" />
  
  <!-- Sombra suave en la base -->
  <ellipse cx="50" cy="112" rx="26" ry="3.5" fill="#EAE5DC" opacity="0.6" />
  
  <!-- Cuerpo de cristal del frasco -->
  <path d="M32 56 C22 56, 17 65, 17 75 L21 103 C23 108, 27 108, 50 108 C73 108, 77 108, 79 103 L83 75 C83 65, 78 56, 68 56 Z" 
        fill="#FFFFFF" 
        stroke="#C5A880" 
        stroke-width="1.5" 
        stroke-linejoin="round" />
  
  <!-- Cánula interior (tubo atomizador) -->
  <line x1="50" y1="56" x2="50" y2="103" stroke="#DEDBD3" stroke-width="1" stroke-linecap="round" />
  
  <!-- Etiqueta minimalista central -->
  <rect x="33" y="73" width="34" height="20" rx="1" fill="#FAF8F5" stroke="#E5E0D8" stroke-width="0.75" />
  <line x1="39" y1="80" x2="61" y2="80" stroke="#C5A880" stroke-width="0.8" stroke-linecap="round" />
  <line x1="43" y1="85" x2="57" y2="85" stroke="#9C7C38" stroke-width="0.6" stroke-linecap="round" />
  
  <!-- Cuello pulverizador dorado -->
  <rect x="44" y="44" width="12" height="12" rx="1" fill="#E8D6AE" stroke="#C5A880" stroke-width="1.2" />
  
  <!-- Tapa ovalada con reflejo -->
  <ellipse cx="50" cy="34" rx="14" ry="9" fill="#F4EFE6" stroke="#9C7C38" stroke-width="1.5" />
  <ellipse cx="47" cy="32" rx="8" ry="4" fill="#FFFFFF" opacity="0.7" />
</svg>
