# =============================================================================
# CONFIGURACIÓN DE ANÁLISIS DE CÓDIGO - SONARCLOUD
# Proyecto: Maison des Parfums
# =============================================================================

# Identificadores de SonarCloud (asociados a la cuenta de GitHub)
sonar.projectKey=JersonCh_maison
sonar.organization=jersonch

# Nombre y versión del proyecto
sonar.projectName=Maison des Parfums
sonar.projectVersion=1.0.0

# Directorio de código fuente a auditar
sonar.sources=src

# Directorio de pruebas y patrones de archivos de test
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusiones de escaneo (ignorar compilados, librerías y activos estáticos)
sonar.exclusions=dist/**,.astro/**,public/**,node_modules/**,coverage/**,migrations/**,**/*.d.ts

# Codificación y configuración de TypeScript
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Ruta del informe de cobertura para pruebas unitarias (Vitest / Jest LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
